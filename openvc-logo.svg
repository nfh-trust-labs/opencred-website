<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="openvc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Open circle representing openness/universality -->
    <circle cx="50" cy="50" r="42" fill="none"
            stroke="url(#openvc-gradient)" stroke-width="3"
            stroke-dasharray="200 64"/>

    <!-- V shape with checkmark integrated - represents Verification -->
    <path d="M 30 38 L 48 62 L 75 28"
          fill="none"
          stroke="url(#openvc-gradient)"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Verification node at checkmark tip -->
    <circle cx="75" cy="28" r="5" fill="url(#openvc-gradient)"/>

    <!-- Start node -->
    <circle cx="30" cy="38" r="4" fill="url(#openvc-gradient)"/>

    <!-- Center connection node -->
    <circle cx="48" cy="62" r="4.5" fill="url(#openvc-gradient)"/>
</svg>
