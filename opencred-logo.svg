<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="card-gradient-c" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#34a853;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Simple minimalist card -->
    <rect x="18" y="22" width="50" height="62" rx="5" ry="5"
          fill="none"
          stroke="url(#card-gradient-c)"
          stroke-width="3"/>

    <!-- QR code representation (dots) -->
    <rect x="26" y="55" width="20" height="20" rx="2" ry="2"
          fill="none" stroke="url(#card-gradient-c)" stroke-width="2"/>
    <rect x="29" y="58" width="5" height="5" fill="url(#card-gradient-c)"/>
    <rect x="38" y="58" width="5" height="5" fill="url(#card-gradient-c)"/>
    <rect x="29" y="67" width="5" height="5" fill="url(#card-gradient-c)"/>
    <rect x="35" y="64" width="3" height="3" fill="url(#card-gradient-c)"/>

    <!-- Header lines -->
    <line x1="26" y1="32" x2="60" y2="32" stroke="url(#card-gradient-c)" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="42" x2="52" y2="42" stroke="url(#card-gradient-c)" stroke-width="2" stroke-linecap="round"/>

    <!-- Verification shield badge -->
    <path d="M 72 30 L 72 55 Q 72 72 72 72 Q 60 65 72 72 Q 84 65 72 72 L 72 55 L 72 30 L 58 38 L 72 30 L 86 38 Z"
          fill="none" stroke="url(#card-gradient-c)" stroke-width="0"/>

    <path d="M 72 28 L 56 38 L 56 55 Q 56 70 72 78 Q 88 70 88 55 L 88 38 Z"
          fill="url(#card-gradient-c)"/>

    <!-- Checkmark in shield -->
    <path d="M 63 52 L 69 58 L 81 46"
          fill="none"
          stroke="white"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>
</svg>
